appId: com.lakmini.mobile-management
productName: Lakmini Mobile Manager
copyright: Software By Chamindu

directories:
  buildResources: build
  output: release

files:
  - out/**/*

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/logo.png

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: build/icon.icns
  category: public.app-category.business

linux:
  target:
    - target: AppImage
      arch:
        - x64
  icon: build/icon.png
  category: Office

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/logo.png
  uninstallerIcon: build/logo.png

publish:
  provider: github
  owner: chamindudkc
  repo: lakmini-mobile-management-system
